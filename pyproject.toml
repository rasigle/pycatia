[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyv5"
description = "A python module to interface with the CATIA/DELMIA V5 COM object."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Paul Bourne", email = "evereux@gmail.com" },
]
keywords = ["CATIA", "CATIA V5", "CAD", "COM", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
    "pywin32>=224; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/evereux/pyv5"
Documentation = "https://pyv5.readthedocs.io"
Repository = "https://github.com/evereux/pyv5"
Changelog = "https://github.com/evereux/pyv5/blob/master/CHANGELOG.md"
Issues = "https://github.com/evereux/pyv5/issues"

[tool.setuptools.dynamic]
version = {attr = "pyv5.version.__version__"}

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
    "sphinx-togglebutton",
    "sphinxcontrib-jquery",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    "build",
    "mypy",
    "black>=25.11.0",
    "ruff>=0.16.10",
    "nuitka",
    "ordered-set",
    "twine",
]

[tool.setuptools.packages.find]
include = ["pyv5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

ignore=[
    "B904",
    "E501"
]

[tool.ruff.lint.pydocstyle]
convention = "google"